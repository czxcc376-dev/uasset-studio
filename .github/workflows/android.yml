name: Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      mode:
        description: '构建类型'
        required: true
        default: 'debug'
        type: choice
        options: [debug, release]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 构建 Web 资源
        run: node scripts/build-web.mjs

      - name: 校验 Web 产物洁净性
        run: node scripts/verify-web.mjs

      - name: 生成测试夹具并跑测试
        run: |
          node scripts/make-fixture.mjs
          node --test test/*.test.mjs
          node test/e2e.mjs
          node test/byte-regression.mjs

      - name: 准备签名（release 且配置了 secrets）
        if: ${{ inputs.mode == 'release' || startsWith(github.ref, 'refs/tags/v') }}
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "签名密钥已就绪"
          else
            echo "未配置 KEYSTORE_B64，将使用 debug 签名"
          fi

      - name: 构建 APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          MODE="${{ inputs.mode || 'release' }}"
          if [ -z "${KEYSTORE_PATH:-}" ]; then MODE=debug; fi
          bash scripts/build-apk.sh "$MODE"

      - name: 校验 APK
        run: |
          set -e
          APK=$(ls dist/*.apk | head -1)
          echo "APK: $APK"
          ls -lh "$APK"
          # aapt 在 SDK build-tools 里
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -r | head -1)
          if [ -n "$AAPT" ]; then
            "$AAPT" dump badging "$APK" | head -5 || true
          fi
          # 确认 assets 里有 index.html 与 app.js
          unzip -l "$APK" | grep -E "assets/(index\.html|app\.js)" || { echo "APK 内缺 Web 资源"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: uasset-studio-apk
          path: dist/*.apk

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
